uuid: e945234d-6d9e-44d5-a5df-e49790460ce4
langcode: en
status: true
dependencies: {  }
id: cs_spotlight_migration
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - JSON
  - Articles
  - Content
migration_group: custom_content
label: 'Import Articles from JSON'
source:
  plugin: url
  data_fetcher_plugin: http
  data_parser_plugin: json
  urls: 'https://cardinalservice-dev.sites-pro.stanford.edu/spotlight-exporter'
  item_selector: 0
  constants:
    basic_html: stanford_html
    minimal_html: stanford_minimal_html
  fields:
    -
      name: title
      label: Title
      selector: title
    -
      name: body
      label: 'Body Content'
      selector: body
    -
      name: uid
      label: 'User ID'
      selector: uid
    -
      name: su_spotlight_person_type
      label: 'Spotlight person type'
      selector: su_spotlight_person_type
    -
      name: su_spotlight_student_name
      label: 'Spotlight student name'
      selector: su_spotlight_student_name
    -
      name: su_spotlight_context
      label: 'Spotlight context'
      selector: su_spotlight_context
  ids:
    title:
      type: string
process:
  type:
    plugin: default_value
    default_value: stanford_news
  title: title
  su_news_components:
    -
      plugin: skip_on_empty
      source: body
      method: process
    -
      plugin: entity_revision_generate
      entity_type: paragraph
      bundle_key: type
      bundle: stanford_wysiwyg
      value_key: su_wysiwyg_text
      ignore_case: true
      values:
        su_wysiwyg_text/value: body
        su_wysiwyg_text/format: constants/basic_html
  uid:
    plugin: migration_lookup
    migration: users
    source: uid
    no_stub: true
  su_news_byline: su_spotlight_student_name
  su_news_topics: su_spotlight_person_type
  status:
    plugin: default_value
    default_value: 1
  created:
    plugin: callback
    callable: strtotime
  changed:
    plugin: callback
    callable: strtotime
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: 'entity:node'
  default_bundle: stanford_news
  overwrite_properties:
    - title
migration_dependencies: null
