settings:
  markup:
    value: '<div><p><img src="https://su-sws.github.io/stanford_basic/src/assets/img/lockup-example.png" alt=""></p><p>These branding options are only available on Stanford Basic. Users of the Minimally Branded or Faculty themes should use the default lockup. To determine which lockup is right for your official unit, consult <a href="https://identity.stanford.edu/visual-identity/stanford-logos/department-branding/">Department Branding</a> section of the Stanford Identity Guide.</p><p>This branding will appear in the top left corner of the header section for your site. Separate settings for the lockup at the bottom of your site can be found in the <a href="/admin/config/system/local-footer">Local Footer settings</a> and will not be affected by changes you make here.</p></div>'
    format: stanford_html
field_type: markup
