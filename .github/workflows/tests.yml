# The tests run in the shared stanford-caravan workflow; see "GitHub Actions"
# in the stanford-caravan README for its inputs.
name: Tests
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let every push to a release branch finish, so each merge gets a result.
  cancel-in-progress: ${{ !endsWith(github.ref, '.x') }}
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    uses: SU-SWS/stanford-caravan/.github/workflows/drupal-tests.yml@12.x
    with:
      php-versions: '["8.4", "8.5"]'
      codeception-shards: ${{ fromJSON(vars.TEST_SHARDS || '4') }}
      phpcs: fail
      phpstan: fail
    secrets: inherit

  # The required status check in the *.x ruleset.
  all-tests-pass:
    name: All Tests Pass
    if: always()
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Tests: $RESULT"
          [ "$RESULT" = "success" ]
