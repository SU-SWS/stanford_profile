_meta:
  version: '1.0'
  entity_type: wordpress_migration
  uuid: 3dc95791-2472-4fc4-8d66-cca4d900da4b
default:
  status:
    -
      value: true
  label:
    -
      value: test
  base_url:
    -
      value: 'https://stvp.stanford.edu'
  configuration:
    -
      taxonomies:
        -
          source: /wp/v2/organization
          destination: stanford_person_types
      content:
        /wp/v2/contributor:
          stanford_person:
            -
              source: title/rendered
              settings: null
              destination: title
            -
              source: content/rendered
              settings: null
              destination: body/value
            -
              source: meta/contributor_first_name
              settings: null
              destination: su_person_first_name
            -
              source: meta/contributor_last_name
              settings: null
              destination: su_person_last_name
            -
              source: meta/__contributor_core_title
              settings: null
              destination: su_person_short_title
            -
              source: featured_media
              settings: null
              destination: su_person_photo
            -
              source: meta/__contributor_is_power_contributor
              settings: null
              destination: su_person_type_group
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  search: '/ .*$/'
                  replace: ''
                  regex: true
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_first_name
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  search: '/^.*? /'
                  replace: ''
                  regex: true
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_last_name
  metatag:
    -
      tag: meta
      attributes:
        name: title
        content: '| University'
    -
      tag: link
      attributes:
        rel: canonical
        href: 'http://default/node/14'
    -
      tag: meta
      attributes:
        property: 'og:site_name'
        content: University
    -
      tag: meta
      attributes:
        property: 'og:type'
        content: website
    -
      tag: meta
      attributes:
        property: 'og:url'
        content: 'http://default/node/14'
