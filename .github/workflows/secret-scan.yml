name: Secret Scan
on:
  pull_request:
  push:
    branches:
      - '13.x'
  schedule:
    # Weekly scan of the full history, Mondays at 9:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commit ranges and the weekly scan can be read.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version
      - name: Determine commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          # Pull requests and pushes only scan the new commits. The schedule,
          # manual runs and a push without a previous commit scan everything.
          if [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            echo "log_opts=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          echo "Scanning commits: ${LOG_OPTS}"
          # --redact keeps secrets out of the job log. Uses .gitleaks.toml and
          # .gitleaksignore from the repository root.
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${LOG_OPTS}" \
            --redact \
            --no-banner \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json
      - name: Summarize findings
        if: failure()
        run: |
          {
            echo "## Secrets found"
            echo
            echo "Remove the secret from the code **and rotate it**: it is already in the git history."
            echo "If a finding is a false positive, add its fingerprint to \`.gitleaksignore\` with a comment explaining why."
            echo
            echo "| Rule | File | Line | Commit | Fingerprint |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) | `\(.Fingerprint)` |"' gitleaks-report.json
          } >> "$GITHUB_STEP_SUMMARY"
