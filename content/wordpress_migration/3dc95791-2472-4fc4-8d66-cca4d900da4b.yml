_meta:
  version: '1.0'
  entity_type: wordpress_migration
  uuid: 3dc95791-2472-4fc4-8d66-cca4d900da4b
default:
  status:
    -
      value: true
  label:
    -
      value: 'Person Content'
  base_url:
    -
      value: 'https://stvp.stanford.edu'
  configuration:
    -
      taxonomies:
        -
          source: /wp/v2/organization
          destination: stanford_person_types
      content:
        /wp/v2/contributor:
          stanford_person:
            -
              source: title/rendered
              settings: null
              destination: title
            -
              source: content/rendered
              settings: null
              destination: body/value
            -
              source: meta/contributor_first_name
              settings: null
              destination: su_person_first_name
            -
              source: meta/contributor_last_name
              settings: null
              destination: su_person_last_name
            -
              source: meta/__contributor_core_title
              settings: null
              destination: su_person_short_title
            -
              source: featured_media
              settings: null
              destination: su_person_photo
            -
              source: meta/__contributor_is_power_contributor
              settings:
                -
                  plugin: str_replace
                  search:
                    - '1'
                    - '0'
                  replace:
                    - 'Core Contributor'
                    - Contributor
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: entity_generate
                  entity_type: taxonomy_term
                  bundle_key: vid
                  bundle: stanford_person_types
                  value_key: name
                  ignore_case: true
              destination: su_person_type_group
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  search: '/ .*$/'
                  replace: ''
                  regex: true
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_first_name
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  search: '/^.*? /'
                  replace: ''
                  regex: true
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_last_name
            -
              source: organization
              settings: null
              destination: su_person_type_group
        /wp/v2/student:
          stanford_person:
            -
              source: title/rendered
              settings: null
              destination: title
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  regex: true
                  search: '/ .*/'
                  replace: ''
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_first_name
            -
              source: title/rendered
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: callback
                  callable: html_entity_decode
                -
                  plugin: str_replace
                  regex: true
                  search: '/^.*? /'
                  replace: ''
                -
                  plugin: substr
                  start: 0
                  length: 255
              destination: su_person_last_name
            -
              source: acf/student_picture
              settings: null
              destination: su_person_photo
            -
              source: content/rendered
              settings: null
              destination: body/value
            -
              source: acf/student_bio
              settings: null
              destination: body/value
            -
              source: acf/student_linkedin_profile_url
              settings: null
              destination: su_person_source/uri
            -
              source: acf/dissertation_title
              settings: null
              destination: body/value
            -
              source: acf/phd_alum_title
              settings: null
              destination: su_person_full_title
            -
              source: acf/student_program
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: entity_generate
                  entity_type: taxonomy_term
                  bundle_key: vid
                  bundle: stanford_person_types
                  value_key: name
                  ignore_case: true
              destination: su_person_type_group
            -
              source: acf/student_class
              settings:
                -
                  plugin: skip_on_empty
                  method: process
                -
                  plugin: entity_generate
                  entity_type: taxonomy_term
                  bundle_key: vid
                  bundle: stanford_person_types
                  value_key: name
                  ignore_case: true
              destination: su_person_type_group
            -
              source: __empty
              settings:
                -
                  plugin: default_value
                  default_value: Student
                -
                  plugin: entity_generate
                  entity_type: taxonomy_term
                  bundle_key: vid
                  bundle: stanford_person_types
                  value_key: name
                  ignore_case: true
              destination: su_person_type_group
  metatag:
    -
      tag: meta
      attributes:
        name: title
        content: '| University'
    -
      tag: link
      attributes:
        rel: canonical
        href: 'http://default/node/14'
    -
      tag: meta
      attributes:
        property: 'og:site_name'
        content: University
    -
      tag: meta
      attributes:
        property: 'og:type'
        content: website
    -
      tag: meta
      attributes:
        property: 'og:url'
        content: 'http://default/node/14'
